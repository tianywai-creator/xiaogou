<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ESP32 控制台</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); width: 85%; max-width: 350px; text-align: center; }
        
        /* 状态指示灯逻辑 */
        .status-container { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #bbb; transition: 0.3s; }
        .online { background: #34c759; box-shadow: 0 0 10px #34c759; } /* 在线：绿 */
        .offline { background: #bbb; box-shadow: none; }               /* 离线：灰 */

        h2 { color: #333; margin: 0 0 30px 0; font-size: 22px; }
        button { 
            width: 100%; height: 60px; margin: 10px 0; border: none; border-radius: 16px;
            font-size: 17px; font-weight: 500; cursor: pointer; transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-on { background: #34c759; color: white; }
        .btn-off { background: #ff3b30; color: white; }
        .btn-cmd { background: #007aff; color: white; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        .footer { font-size: 12px; color: #aaa; margin-top: 20px; height: 1em; }
    </style>
</head>
<body>

<div class="container">
    <div class="status-container">
        <div id="dot" class="dot"></div>
        <span id="status-text" style="font-size: 14px; color: #666;">检测中...</span>
    </div>
    <h2>设备控制</h2>
    <button class="btn-on" onclick="send('on')">开启</button>
    <button class="btn-off" onclick="send('off')">关闭</button>
    <button class="btn-cmd" onclick="send('triple')">开 3 下</button>
    <div id="log" class="footer"></div>
</div>

<script>
    const uid = "1944c79a18f345f487dde0852bd49c3b";
    const topic = "switch006";

    // 1. 发送控制指令
    function send(msg) {
        document.getElementById('log').innerText = "指令已下发";
        fetch("https://apis.bemfa.com/va/postJsonMsg", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uid: uid, topic: topic, type: 1, msg: msg })
        })
        .then(() => {
            setTimeout(() => { document.getElementById('log').innerText = ""; }, 2000);
        });
    }

    // 2. 只检测是否在线
    async function checkOnline() {
        try {
            const res = await fetch(`https://apis.bemfa.com/va/online?uid=${uid}&topic=${topic}&type=1`);
            const data = await res.json();
            
            const dot = document.getElementById('dot');
            const text = document.getElementById('status-text');

            if (data.data === true) {
                dot.className = "dot online";
                text.innerText = "设备在线";
            } else {
                dot.className = "dot offline";
                text.innerText = "设备离线";
            }
        } catch (e) {
            document.getElementById('status-text').innerText = "网络请求失败";
        }
    }

    // 3. 定时轮询 (每3秒同步一次状态)
    setInterval(checkOnline, 5000);
    checkOnline(); 
</script>

</body>
</html>
