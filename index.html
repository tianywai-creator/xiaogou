<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泡泡控制台</title>
    <style>
        :root {
            --primary-color: #007aff;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --bg-color: #f2f2f7;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 85%;
            max-width: 350px;
            text-align: center;
        }

        h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #1c1c1e; }

        /* 状态显示 */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 30px;
            font-size: 0.85rem;
            color: #8e8e93;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #c7c7cc;
        }
        .online { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .offline { background: var(--danger-color); }

        /* 垂直按钮组 */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 15px; /* 按钮之间的间距 */
        }

        button {
            border: none;
            background: white;
            color: var(--primary-color);
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(0, 122, 255, 0.2);
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        /* 激活（按下）效果 */
        button:active {
            background: var(--primary-color);
            color: white;
            transform: scale(0.97);
        }

        /* 日志提示区 */
        #log {
            height: 20px;
            font-size: 0.85rem;
            margin-top: 25px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>泡泡控制台</h2>
    
    <div class="status-bar">
        <div id="dot" class="dot"></div>
        <span id="status-text">检测状态中...</span>
    </div>

    <div class="button-stack">
        <button onclick="sendFeed(1)">触发 1 次</button>
        <button onclick="sendFeed(2)">触发 2 次</button>
        <button onclick="sendFeed(3)">触发 3 次</button>
        <button onclick="sendFeed(4)">触发 4 次</button>
        <button onclick="sendFeed(5)">触发 5 次</button>
    </div>

    <div id="log"></div>
</div>

<script>
    const uid = "1944c79a18f345f487dde0852bd49c3b";
    const topic = "dog006";

    function sendFeed(count) {
        const msg = "start" + count; 
        const logDiv = document.getElementById('log');

        logDiv.style.color = "var(--primary-color)"; 
        logDiv.innerText = "发送指令: " + count + " 份";

        fetch("https://apis.bemfa.com/va/postJsonMsg", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                uid: uid, 
                topic: topic, 
                type: 1, 
                msg: msg 
            })
        })
        .then(res => res.json())
        .then(data => {
            logDiv.innerText = "✅ 指令已送达";
            setTimeout(() => { logDiv.innerText = ""; }, 2500);
        })
        .catch(err => {
            logDiv.innerText = "❌ 网络连接失败";
            logDiv.style.color = "var(--danger-color)"; // 这里也要加引号
        });
    }
    async function checkOnline() {
        try {
            const res = await fetch(`https://apis.bemfa.com/va/online?uid=${uid}&topic=${topic}&type=1`);
            const data = await res.json();
            const dot = document.getElementById('dot');
            const text = document.getElementById('status-text');

            if (data.data === true) {
                dot.className = "dot online";
                text.innerText = "设备在线";
            } else {
                dot.className = "dot offline";
                text.innerText = "设备离线";
            }
        } catch (e) {
            document.getElementById('status-text').innerText = "状态获取失败";
        }
    }

    setInterval(checkOnline, 5000);
    checkOnline();
</script>

</body>
</html>
