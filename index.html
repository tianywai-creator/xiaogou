<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泡泡吃饭控制终端</title>
    <style>
        :root {
            --primary-color: #007aff;
            --success-color: #34c759;
            --danger-color: #ff3b30;
            --bg-color: #f2f2f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-bottom: 1.5rem; color: #1c1c1e; }

        /* 状态栏样式 */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8e8e93;
        }
        .online { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .offline { background: var(--danger-color); }

        /* 按钮网格 */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        button {
            border: none;
            background: var(--primary-color);
            color: white;
            padding: 15px 10px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:active { transform: scale(0.95); background: #0056b3; }

        /* 日志提示 */
        #log {
            height: 20px;
            font-size: 0.85rem;
            color: var(--primary-color);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>泡泡吃饭了</h2>
    
    <div class="status-bar">
        <div id="dot" class="dot"></div>
        <span id="status-text">检测中...</span>
    </div>

    <div class="button-grid">
        <button onclick="sendFeed(1)">1份</button>
        <button onclick="sendFeed(2)">2份</button>
        <button onclick="sendFeed(3)">3份</button>
        <button onclick="sendFeed(4)">4份</button>
        <button onclick="sendFeed(5)">5份</button>
    </div>

    <div id="log"></div>
</div>

<script>
    // 配置信息（已根据你的信息填好）
    const uid = "1944c79a18f345f487dde0852bd49c3b";
    const topic = "dog006"; // 刚才代码里改成的 dog006

    // 发送喂食指令
    function sendFeed(count) {
        const msg = "start" + count; 
        const logDiv = document.getElementById('log');
        
        logDiv.style.color = "var(--primary-color)";
        logDiv.innerText = "正在下发: " + count + " 次触摸...";

        fetch("https://apis.bemfa.com/va/postJsonMsg", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                uid: uid, 
                topic: topic, 
                type: 1, 
                msg: msg 
            })
        })
        .then(res => res.json())
        .then(data => {
            logDiv.innerText = "✅ 发送成功 (" + count + "份)";
            setTimeout(() => { logDiv.innerText = ""; }, 3000);
        })
        .catch(err => {
            logDiv.innerText = "❌ 发送失败，请检查网络";
            logDiv.style.color = "var(--danger-color)";
        });
    }

    // 状态检测
    async function checkOnline() {
        try {
            const res = await fetch(`https://apis.bemfa.com/va/online?uid=${uid}&topic=${topic}&type=1`);
            const data = await res.json();
            const dot = document.getElementById('dot');
            const text = document.getElementById('status-text');

            if (data.data === true) {
                dot.className = "dot online";
                text.innerText = "设备在线";
            } else {
                dot.className = "dot offline";
                text.innerText = "设备离线";
            }
        } catch (e) {
            document.getElementById('status-text').innerText = "API 请求失败";
        }
    }

    // 初始化和定时器
    setInterval(checkOnline, 5000);
    checkOnline();
</script>

</body>
</html>
